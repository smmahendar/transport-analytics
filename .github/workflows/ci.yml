name: Transport Analytics CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: find . -maxdepth 2 -type f | sort

      - name: Validate expected directories
        run: |
          test -d src
          test -d tests
          test -d docs
          test -d config
