[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-analytics"
version = "0.1.0"
description = "Transport Analytics metadata integration and lineage framework"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
transport-metadata = "metadata_framework.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
